[Meta]
ConfigRevision=2102

; Darksiders Genesis Enhanced ASI
; V0.21 horse reflection-field test defaults
; The General tab has been removed.
; Menu-key rebinding and Save/Reload/Reset live in Hotkeys.
; Every tunable gameplay option is represented as Enabled + Value.
;
; IMPORTANT:
; All requested features remain enabled by default.
; Active V0.9B hooks: Jump Height, Glide / Flight Duration.
; V0.14A mount detection was rejected in game.
; V0.14B GetMaxSpeed scaling was rejected in game.
; V0.14C never armed horse runtime because IsHorseActive signature resolution failed.
; V0.14D horse heartbeat fix retained.
; V0.14E Jump Height 20x + per-value Default buttons retained.
; V0.16A starts from the stability-validated V0.14F core.
; Horse uses only the already validated shared GetMaxSpeed hook. No extra hook, actor scan, mount pointer, or vtable resolver.
; V0.17 validates the exact target EXE before gameplay hooks, separates PlayerIdentity from local-pawn state,
; publishes gameplay settings through atomics, and debounces INI writes.

[Overlay]
Enabled=1
MenuKey=Insert

[System]
GraphicsAdapter=0

[Features]
; V0.43: old startup attachment bypass causes possible reticle bug.
; Keep OFF for correct native MoviePlayer/Slate lifecycle.
SkipLogos=1
; V0.51 TEST: V0.49 exact-name diagnostic restored.
; At native count=2 the names are logged, NOT removed, to protect intro.
ToggleHUD=1
HideReticle=0
MovementSpeed=1
ActionRecovery=1
SkipIntroVideos=1
ThirdPerson=0
PistolDamage=1
MeleeDamage=1
JumpHeight=1
GlideDuration=1
HorseSpeed=1
HorseSprintSpeed=1
HorseSprintDuration=1
FOV=0
HotstreakCharge=1

