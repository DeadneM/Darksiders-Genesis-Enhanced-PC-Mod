name: One-time archival cleanup of historical dev branches
on:
  push:
    branches:
      - debug
    paths:
      - .github/workflows/cleanup-historical-branches.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify all archived commit heads, then remove obsolete dev refs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: archivedRef } = await github.rest.git.getRef({owner, repo, ref: 'heads/archive'});
            await github.rest.git.getRef({owner, repo, ref: 'heads/debug'});
            await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            // Require readable index and the archived V0.89 distribution before pruning anything.
            await github.rest.repos.getContent({owner, repo, path: 'ARCHIVE_BRANCH_INDEX.md', ref: 'archive'});
            await github.rest.repos.getContent({owner, repo, path: 'docs/V0_89_SCOPED_HORSE_REGION_TEST.md', ref: 'archive'});
            const dev = (await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100}))
              .filter(branch => branch.name.startsWith('dev/'));
            const preservedHeads = new Set();
            let sha = archivedRef.object.sha;
            let foundIndex = false;
            for (let step = 0; step < 64; step++) {
              const {data: commit} = await github.rest.git.getCommit({owner, repo, commit_sha: sha});
              for (const p of commit.parents.slice(1)) preservedHeads.add(p.sha);
              if (commit.message.includes('index exact SHA heads')) {foundIndex = true; break;}
              if (!commit.parents.length) break;
              sha = commit.parents[0].sha;
            }
            if (!foundIndex) throw new Error('Archive chain index commit not found: refusing deletions');
            const missing = dev.filter(b => !preservedHeads.has(b.commit.sha));
            if (missing.length) throw new Error('Missing from archive: ' + missing.map(b => b.name).join(', '));
            core.info('Archive preflight passed for ' + dev.length + ' historical dev heads');
            let deleted = 0;
            for (const branch of dev) {
              if (!branch.name.startsWith('dev/')) throw new Error('Ref out of allowed scope');
              const ref = 'heads/' + branch.name;
              const {data: live} = await github.rest.git.getRef({owner, repo, ref});
              if (live.object.sha !== branch.commit.sha) {
                core.warning('Branch moved during cleanup, preserved: ' + branch.name);
                continue;
              }
              await github.rest.git.deleteRef({owner, repo, ref});
              deleted++;
            }
            core.summary.addHeading('Darksiders development history preserved');
            core.summary.addRaw('Archived head SHAs: ' + preservedHeads.size + '; deleted legacy branches: ' + deleted + '/' + dev.length + '. Stable main, debug and archive were not modified by deletion.').write();
            core.info('Removed ' + deleted + ' of ' + dev.length + ' legacy dev branches');
