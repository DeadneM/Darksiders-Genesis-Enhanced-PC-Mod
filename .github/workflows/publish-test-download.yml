name: Publish Direct Test Downloads

# Persistent direct-download fallback: publishes exact successful build artifacts
# as test binaries, without creating releases or branches.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-test-download.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch and verify fallback and diagnostic ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $builds = @(
            @{ Version = "0.37"; Run = "37846344153"; Artifact = "DarksidersGenesis_ASI_V0.37_CAMERA_HEIGHT_HOTKEYS_TEST"; File = "DarksidersGenesis_V0.37_LAST_WORKING.zip" },
            @{ Version = "0.39"; Run = "37849435697"; Artifact = "DarksidersGenesis_ASI_V0.39_STARTUP_DIAGNOSTIC_TEST"; File = "DarksidersGenesis_V0.39_DIAGNOSTIC.zip" }
          )
          $downloads = Join-Path $PWD "downloads"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($build in $builds) {
            $temp = Join-Path $PWD (".download-staging/" + $build.Version)
            New-Item -ItemType Directory -Path $temp -Force | Out-Null
            gh run download $build.Run --repo "${{ github.repository }}" --name $build.Artifact --dir $temp
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($build.Artifact)" }
            $expected = @("dxgi.dll", "DarksidersGenesisMod.asi", "DarksidersGenesisMod.ini", "README.md")
            foreach ($name in $expected) {
              if (-not (Test-Path (Join-Path $temp $name))) { throw "Missing $name from $($build.Version)" }
            }
            $output = Join-Path $downloads $build.File
            if (Test-Path $output) { Remove-Item $output -Force }
            Compress-Archive -Path (Join-Path $temp "*") -DestinationPath $output -CompressionLevel Optimal
            $archive = [System.IO.Compression.ZipFile]::OpenRead($output)
            try {
              $names = @($archive.Entries | ForEach-Object { $_.FullName })
              if ($names.Count -ne 4) { throw "Wrong ZIP file count: $($build.Version)" }
              foreach ($name in $names) {
                if ($name.Contains("/")) { throw "Nested path in $($build.Version): $name" }
              }
              Write-Host "V$($build.Version) ROOT ZIP validated: $($names -join ', ')"
            } finally {
              $archive.Dispose()
            }
            Get-FileHash $output -Algorithm SHA256
          }

      - name: Commit permanent direct downloads on main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/DarksidersGenesis_V0.37_LAST_WORKING.zip" "downloads/DarksidersGenesis_V0.39_DIAGNOSTIC.zip"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Downloads already current"; exit 0 }
          git commit -m "downloads: publish V0.37 fallback and V0.39 diagnostic ZIPs"
          if ($LASTEXITCODE -ne 0) { throw "Git commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Git push failed" }
