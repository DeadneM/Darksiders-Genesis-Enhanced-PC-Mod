name: Debug Windows x64 TEST
on:
  push:
    branches: [debug]
    paths:
      - "src/**"
      - "tests/**"
      - "updater/*.cs"
      - "config/**"
      - "CMakeLists.txt"
      - "README.md"
      - ".github/scripts/package-mod.ps1"
      - ".github/workflows/build-v090-debug.yml"
permissions:
  contents: write
concurrency:
  group: v090-debug-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read archive identity from the compiled build header
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $header = Get-Content -Raw -LiteralPath src/BuildInfo.h
          $archive = [regex]::Match($header, 'Archive\[\]="([^"]+)"').Groups[1].Value
          $version = [regex]::Match($header, 'Version\[\]="(V[0-9]+\.[0-9]+)"').Groups[1].Value
          if ($archive -notmatch '^DarksidersGenesis_V[0-9]+\.[0-9]+_[A-Z0-9_]+\.zip$' -or -not $version -or -not $archive.StartsWith("DarksidersGenesis_" + $version + "_")) { throw 'Invalid or inconsistent build archive identity' }
          "DG_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DDG_ENABLE_ANALYZE=ON
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }
      - name: Check policies, user defaults and shipped INI parity
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Policy or configuration tests failed" }
      - name: Package verified two root binaries
        if: ${{ !contains(github.event.head_commit.message, '[check only]') }}
        shell: pwsh
        run: |
          ./.github/scripts/package-mod.ps1 -ZipPath ('downloads/' + $env:DG_ARCHIVE)
      - name: Upload verified Windows x64 ZIP
        if: ${{ !contains(github.event.head_commit.message, '[check only]') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DG_ARCHIVE }}
          path: downloads/${{ env.DG_ARCHIVE }}
          if-no-files-found: error
      - name: Preserve numbered experimental ZIP in debug
        if: ${{ !contains(github.event.head_commit.message, '[check only]') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always update from the current branch head BEFORE staging the ZIP.
          # A preceding job may have published this version: verify immutable bytes.
          # Never git rebase a binary archive (add/add creates an unresolvable conflict).
          $published = $false
          for ($i=0; $i -lt 5; $i++) {
            git fetch origin debug
            if ($LASTEXITCODE -ne 0) { throw 'Fetch failed' }
            git diff --quiet $env:GITHUB_SHA origin/debug -- src tests config updater CMakeLists.txt README.md .github/scripts/package-mod.ps1 .github/workflows/build-v090-debug.yml
            if ($LASTEXITCODE -eq 1) { throw 'Compiled sources have changed on debug; do not publish an obsolete numbered ZIP' }
            if ($LASTEXITCODE -ne 0) { throw 'Compiled source identity check failed' }
            $archivePath = 'downloads/' + $env:DG_ARCHIVE
            $priorBlob = git ls-tree --format='%(objectname)' origin/debug -- $archivePath
            if ($LASTEXITCODE -ne 0) { throw 'Archive identity lookup failed' }
            if ($priorBlob) {
              $builtBlob = git hash-object -- $archivePath
              if ($priorBlob -ne $builtBlob) { throw 'Numbered archive already published with different bytes; refusing overwrite' }
            }
            git reset --mixed origin/debug
            if ($LASTEXITCODE -ne 0) { throw 'Reset to latest origin/debug failed' }
            git add -- $archivePath
            if ($LASTEXITCODE -ne 0) { throw 'Archive add failed' }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Identical archive already published'
              $published = $true
              break
            }
            git commit -m "downloads: preserve verified compiled cumulative ZIP"
            if ($LASTEXITCODE -ne 0) { throw 'Archive commit failed' }
            git push origin HEAD:debug
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $published) { throw 'Permanent experimental ZIP push failed' }
          Write-Host ("ZIP https://raw.githubusercontent.com/" + $env:GITHUB_REPOSITORY + "/debug/downloads/" + $env:DG_ARCHIVE)
