name: V1.43 user defaults release
on:
  push:
    branches: [debug]
    paths:
      - "src/**"
      - "tests/**"
      - "updater/**"
      - "config/**"
      - "CMakeLists.txt"
      - "README.md"
      - ".github/workflows/build-v090-debug.yml"
permissions:
  contents: write
concurrency:
  group: v090-debug-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DDG_ENABLE_ANALYZE=ON
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }
      - name: Check policies, user defaults and shipped INI parity
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Policy or configuration tests failed" }
      - name: Package verified four root files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/out/dxgi.dll dist/
          Copy-Item build/out/DarksidersGenesisMod.asi dist/
          Copy-Item config/DarksidersGenesisMod.ini dist/
          Copy-Item README.md dist/
          New-Item -ItemType Directory -Path downloads -Force | Out-Null
          $zipPath = 'downloads/DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path 'dist/*' -DestinationPath $zipPath -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            $expected = @('dxgi.dll','DarksidersGenesisMod.asi','DarksidersGenesisMod.ini','README.md')
            foreach ($name in $expected) { if ($names -notcontains $name) { throw "Missing root entry $name" } }
            if ($names.Count -ne 4) { throw "ZIP root requires 4 files; got $($names.Count)" }
            if ($names | Where-Object { $_.Contains('/') -or $_.Contains('\') }) { throw 'Nested path in ZIP' }
          } finally { $zip.Dispose() }
          Get-FileHash $zipPath -Algorithm SHA256
      - name: Upload verified Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE
          path: downloads/DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE.zip
          if-no-files-found: error
      - name: Preserve numbered experimental ZIP in debug
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always update from the current branch head BEFORE staging the ZIP.
          # A preceding canceled job may have published the same binary path.
          # Never git rebase a binary archive (add/add creates an unresolvable conflict).
          $published = $false
          for ($i=0; $i -lt 5; $i++) {
            git fetch origin debug
            if ($LASTEXITCODE -ne 0) { throw 'Fetch failed' }
            git reset --mixed origin/debug
            if ($LASTEXITCODE -ne 0) { throw 'Reset to latest origin/debug failed' }
            git add -- downloads/DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE.zip
            if ($LASTEXITCODE -ne 0) { throw 'Archive add failed' }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Identical archive already published'
              $published = $true
              break
            }
            git commit -m "downloads: preserve verified compiled V1.43 cumulative ZIP"
            if ($LASTEXITCODE -ne 0) { throw 'Archive commit failed' }
            git push origin HEAD:debug
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $published) { throw 'Permanent experimental ZIP push failed' }
          Write-Host 'V1.43 ZIP https://raw.githubusercontent.com/'"$env:GITHUB_REPOSITORY"'/debug/downloads/DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE.zip'

      - name: Publish requested V1.43 GitHub release
        if: startsWith(github.event.head_commit.message, '[release v1.43]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DG_RELEASE_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'downloads/DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE.zip'
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = 'V1.43_SHA256.txt'
          [IO.File]::WriteAllText((Join-Path $PWD $checksum), "$digest  DarksidersGenesis_V1.43_USER_DEFAULTS_RELEASE.zip`n", [Text.Encoding]::ASCII)
          gh release create v1.43 $zip $checksum --target $env:DG_RELEASE_SOURCE --title 'Darksiders Genesis Enhanced PC Mod V1.43' --notes-file docs/V1_43_RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation/upload failed; existing releases are not overwritten' }
          gh release edit v1.43 --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Verified release publication failed' }
          gh release view v1.43 --json url,tagName,isDraft,isPrerelease,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release readback failed' }
