name: Build ASI Overlay

concurrency:
  group: build-asi-overlay-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "dev/**"
    paths:
      - "src/**"
      - "config/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-asi-overlay.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "build/out/dxgi.dll" $dist
          Copy-Item "build/out/DarksidersGenesisMod.asi" $dist
          Copy-Item "config/DarksidersGenesisMod.ini" $dist
          Copy-Item "README.md" $dist

          Get-FileHash "build/out/dxgi.dll" -Algorithm SHA256
          Get-FileHash "build/out/DarksidersGenesisMod.asi" -Algorithm SHA256
          Get-FileHash "config/DarksidersGenesisMod.ini" -Algorithm SHA256
          Get-FileHash "README.md" -Algorithm SHA256

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DarksidersGenesis_ASI_V0.34R1_CLEAN_CAMERA_TRACE_TEST
          path: |
            dist/dxgi.dll
            dist/DarksidersGenesisMod.asi
            dist/DarksidersGenesisMod.ini
            dist/README.md
          if-no-files-found: error
