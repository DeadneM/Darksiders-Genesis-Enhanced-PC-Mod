name: Build ASI Overlay

permissions:
  contents: write

concurrency:
  group: build-asi-overlay-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "CMakeLists.txt"
      - "README.md"
      - ".github/workflows/build-asi-overlay.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "build/out/dxgi.dll" $dist
          Copy-Item "build/out/DarksidersGenesisMod.asi" $dist
          Copy-Item "config/DarksidersGenesisMod.ini" $dist
          Copy-Item "README.md" $dist

          Get-FileHash "build/out/dxgi.dll" -Algorithm SHA256
          Get-FileHash "build/out/DarksidersGenesisMod.asi" -Algorithm SHA256
          Get-FileHash "config/DarksidersGenesisMod.ini" -Algorithm SHA256
          Get-FileHash "README.md" -Algorithm SHA256

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DarksidersGenesis_ASI_V0.60
          path: |
            dist/dxgi.dll
            dist/DarksidersGenesisMod.asi
            dist/DarksidersGenesisMod.ini
            dist/README.md
          if-no-files-found: error

      - name: Publish permanent download ZIP on main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "downloads" -Force | Out-Null
          $path = "downloads/DarksidersGenesis_V0.60.zip"
          if (Test-Path $path) { Remove-Item $path -Force }
          Compress-Archive -Path "dist/*" -DestinationPath $path -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            @("dxgi.dll","DarksidersGenesisMod.asi","DarksidersGenesisMod.ini","README.md") | ForEach-Object {
              if ($names -notcontains $_) { throw "Missing ZIP entry: $_" }
            }
            if ($names.Count -ne 4) { throw "Expected exactly 4 root-level entries" }
          } finally { $zip.Dispose() }
          Get-FileHash $path -Algorithm SHA256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "downloads: publish V0.60 ZIP"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Push failed" }
